<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>QUOIN</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="QUOIN. Architectural wear from Nairobi.">
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#8a8a8a;--line:#e6e6e6;--pink:#f0c4d2;--blue:#325c8c;--sky:#a3b7cc;--cream:#f7f4ef;--ink:#2b2b2d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17171a;--fg:#f4f1ea;--mut:#9a9a9a;--line:#333;--cream:#222226}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 "Helvetica Neue",Arial,sans-serif;letter-spacing:.02em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}a{color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid var(--line)}
.wm{text-align:center;text-decoration:none;font-size:30px;letter-spacing:.45em;padding-left:.45em;line-height:1}.wm small{display:block;font-size:8px;letter-spacing:.5em;margin-top:5px}
.hb{width:40px;height:44px;display:flex;flex-direction:column;justify-content:center;gap:7px}.hb i{display:block;height:1px;background:var(--fg)}
.ic{width:80px;text-align:right;font-size:11px;letter-spacing:.1em}.ic button{min-height:44px}
.menu{position:fixed;inset:0 40% 0 0;min-width:240px;background:var(--bg);z-index:50;transform:translateX(-100%);transition:.3s;padding:70px 26px;border-right:1px solid var(--line)}.menu.on{transform:none}
.menu a{display:block;padding:12px 0;font-size:14px;letter-spacing:.14em;text-decoration:none}
.cd{background:var(--ink);color:#fff;text-align:center;padding:22px 16px}.cd small{letter-spacing:.3em;font-size:10px;color:var(--pink)}
.t{display:flex;justify-content:center;gap:22px;margin:12px 0 4px}.t b{display:block;font:300 34px/1 Georgia,serif}.t span{font-size:9px;letter-spacing:.2em;opacity:.6}
.hero{display:grid;grid-template-columns:1fr 1fr;height:240px;transition:.4s}.hero .im{display:flex;align-items:flex-end;justify-content:center;overflow:hidden}.hero .im svg{height:92%}
.hero .tx{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;letter-spacing:.2em;gap:8px;text-align:center}.hero .tx b{font:400 20px Georgia,serif;letter-spacing:.3em}
.dots{display:flex;gap:6px;max-width:480px;margin:18px auto 0;padding:0 20px}.dots i{flex:1;height:1px;background:var(--line)}.dots i.on{background:var(--fg);height:2px}
section{padding:54px 20px 0;max-width:1100px;margin:auto}h2{font:400 22px "Helvetica Neue",Arial,sans-serif;letter-spacing:.12em;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px}
.card{background:var(--bg);box-shadow:0 1px 8px rgba(0,0,0,.09);padding:12px 10px;display:flex;flex-direction:column;text-align:left;min-height:260px;position:relative}
.nw{border:1px solid var(--line);font-size:8px;letter-spacing:.12em;padding:3px 10px;align-self:flex-start}
.card .pic{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 0}.card .pic svg{width:64%}
.nm{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;min-height:26px}.pr{font-size:10px;color:var(--mut);margin:8px 0}
.sw{display:flex;align-items:center;justify-content:space-between}.sw span{display:inline-block;width:14px;height:14px;margin-right:5px;border:1px solid var(--line)}.sw em{font:italic 900 11px Georgia,serif;letter-spacing:.2em}
.hr{position:absolute;right:10px;top:46%;color:var(--line);font-size:18px}.hr.on{color:#d7557e}
.more{text-align:center;margin:34px 0}.more a{border-bottom:1px solid var(--fg);text-decoration:none;font-size:11px;letter-spacing:.1em;padding-bottom:2px}
.band{background:var(--ink);color:#fff;padding:26px 0 18px;margin-top:54px}.band .h{display:flex;justify-content:space-between;max-width:1100px;margin:auto;padding:0 20px 18px;align-items:center}.band h2{margin:0}
.scr{display:flex;gap:6px;overflow-x:auto;padding:0 20px}.scr div{flex:0 0 150px;text-align:center;font-size:10px;letter-spacing:.08em}.scr .p{height:210px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:8px}.scr svg{height:85%}
.hl{display:grid;grid-template-columns:1fr 1fr;gap:6px}.hl .p{height:190px;display:flex;justify-content:center;align-items:flex-end;overflow:hidden}.hl svg{height:90%}.hl p{display:flex;justify-content:space-between;gap:8px;margin:10px 0 22px;font-size:12px}.hl p span{color:var(--mut);font-size:10px;text-align:right}
footer{background:#111;color:#eee;margin-top:70px;padding:50px 20px 30px}.f{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:24px;font-size:11px}.f a{display:block;padding:5px 0;text-decoration:none;opacity:.85;cursor:pointer}
.f h4{font-size:9px;letter-spacing:.2em;color:var(--pink);margin:0 0 8px}.cp{text-align:center;font-size:10px;opacity:.5;margin-top:34px}
.pp{max-width:1000px;margin:0 auto;padding:30px 20px 0}.bc{text-align:center;font-size:10px;margin-bottom:26px;letter-spacing:.06em}
.pg{display:grid;grid-template-columns:1.2fr 1fr;gap:30px}@media(max-width:700px){.pg{grid-template-columns:1fr}}
.big{background:var(--cream);display:flex;align-items:center;justify-content:center;aspect-ratio:1/1.1}.big svg{width:60%}
.pg h1{font:400 14px "Helvetica Neue";letter-spacing:.08em;margin:14px 0 20px;text-transform:uppercase}.pg .pc{font-size:15px}.lb{font-size:9px;color:var(--mut);letter-spacing:.14em;margin:20px 0 8px}
.cs button{display:inline-flex;align-items:center;gap:6px;margin-right:12px;padding:6px 0;font-size:11px}.cs i{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);display:inline-block}.cs .on i{outline:1px solid var(--fg);outline-offset:2px}
.sz button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);margin:0 8px 8px 0;font-size:11px}.sz .on{background:var(--fg);color:var(--bg)}
details{border-bottom:1px solid var(--line);padding:12px 0;font-size:11px}summary{cursor:pointer;font-weight:700;letter-spacing:.08em;list-style:none}details p{color:var(--mut);margin:8px 0 0}
.add{display:block;width:100%;background:#111;color:#fff;padding:16px;margin-top:18px;letter-spacing:.14em;font-size:11px;min-height:48px}.add:disabled{background:var(--line);color:var(--mut);cursor:not-allowed}
.box{border:1px solid var(--line);padding:14px;margin-top:16px;font-size:10px;color:var(--mut)}
#cart{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--bg);z-index:60;transform:translateX(100%);transition:.3s;padding:60px 22px 22px;overflow:auto;border-left:1px solid var(--line)}#cart.on{transform:none}
.cl{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:11px}.x{position:absolute;top:10px;right:14px;font-size:24px;min-width:44px;min-height:44px}
.nf{text-align:center;padding:100px 20px}
body.g header,body.g footer{display:none}.sz button:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.gate{min-height:100vh;min-height:100dvh;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 22px}.gate .wm{font-size:44px}.gate p{max-width:340px;color:#bbb;font-size:12px;margin:12px 0 4px}.gate .cd{background:none;padding:10px 0}
.gate form{display:flex;gap:6px;width:100%;max-width:380px;margin:16px 0 8px}.gate input{flex:1;min-width:0;padding:14px;border:1px solid #666;background:transparent;color:#fff;font:inherit;font-size:16px}.gate form button{background:var(--pink);color:#2b2b2d;padding:0 16px;letter-spacing:.12em;font-size:11px;min-height:48px}
.ck label{display:block;font-size:9px;letter-spacing:.14em;color:var(--mut);margin:12px 0 4px}.ck input,.ck select{width:100%;padding:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:16px}.pm label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg);letter-spacing:0}.pm input{width:auto}
</style></head><body>
<div class="menu" id="menu"><a href="#" onclick="mn()">HOME</a><a href="#shop" onclick="mn()">NEW ARRIVALS</a><a href="#collection" onclick="mn()">COLLECTION</a><a href="#journal" onclick="mn()">JOURNAL</a><a href="#about" onclick="mn()">ABOUT</a><a href="#contact" onclick="mn()">CONTACT</a></div>
<header><button class="hb" aria-label="Menu" onclick="mn()"><i></i><i></i></button><a class="wm" href="#">QUOIN<small>ARCHITECTURAL WEAR</small></a><div class="ic"><button onclick="openCart()" aria-label="Bag">BAG <span id="cn">0</span></button></div></header>
<div id="app"></div>
<footer id="contact"><div class="f"><div><h4>SHOP</h4><a href="#shop">New arrivals</a><a href="#collection">Collection</a><a href="#journal">Journal</a></div><div><h4>CUSTOMER CARE</h4><a data-i="Shipping: Nairobi 1–2 days, rest of Kenya 3–5 days.">Shipping</a><a data-i="Exchanges within 7 days for unworn items. Limited pieces are exchange only.">Returns</a><a data-i="Fit is oversized. Check each product’s details.">Size guide</a><a id="em"></a></div><div><h4>INFORMATION</h4><a data-i="We only use your details to fulfil orders and send updates you ask for.">Privacy policy</a><a data-i="Prices in KES. Limited pieces are available while stock lasts.">Terms of service</a><a id="about" data-i="QUOIN is a creative house from Nairobi. Reclaimed denim, quiet architecture, made to last.">About QUOIN</a></div><div><h4>FOLLOW US</h4><a id="ig" target="_blank" rel="noopener">Instagram</a><a id="tt" target="_blank" rel="noopener">TikTok</a></div></div><div class="cp">© 2026 NJINJU · QUOIN · NAIROBI</div></footer>
<div id="cart"><button class="x" onclick="cartX()" aria-label="Close">×</button><div id="cb"></div></div>
<script>
/* ====== EDIT HERE ====== */
const CFG={launch:'2026-11-22T09:00:00+03:00',maintenance:true,formUrl:'',formKey:'',whatsapp:'254700000000',till:'000000',payLink:'',ship:400,freeOver:15000,hero:[],email:'hello@wearquoin.com',instagram:'https://www.instagram.com/',tiktok:'https://www.tiktok.com/',tagline:'ARCHITECTURAL WEAR',season:'DROP 01 / 2026'};
const PRODUCTS=[ /* img: optional photo path/URL; shape: trouser|jort|hoodie|tee|cap|tote */
{id:'baggy-denim-trouser',name:'Baggy denim trouser',shape:'trouser',price:6500,colors:[['Indigo','#325c8c'],['Black','#2b2b2d']],sizes:['S','M','L','XL'],details:'Reclaimed denim with a diagonal contrast panel. Wide leg. Made in Nairobi.'},
{id:'reclaimed-jort',name:'Reclaimed jort',shape:'jort',price:4200,colors:[['Washed','#7f9bbb'],['Black','#2b2b2d']],sizes:['S','M','L','XL'],details:'Knee-length cut from reclaimed denim.'},
{id:'wide-leg-sweatpant',name:'Wide-leg sweatpant',shape:'trouser',price:4800,colors:[['Pink','#f0c4d2'],['Charcoal','#2b2b2d']],sizes:['S','M','L','XL'],details:'420gsm cotton fleece. Relaxed through the leg.'},
{id:'core-hoodie',name:'Core hoodie',shape:'hoodie',price:5200,colors:[['Charcoal','#2b2b2d'],['Blue','#325c8c']],sizes:['S','M','L','XL'],details:'420gsm brushed cotton fleece. Boxy fit.'},
{id:'quoin-tee',name:'Quoin tee',shape:'tee',price:2400,colors:[['Cream','#f7f4ef'],['Pink','#f0c4d2']],sizes:['S','M','L','XL'],details:'220gsm heavy cotton jersey.'},
{id:'panel-cap',name:'Panel cap',shape:'cap',price:1800,colors:[['Blue','#325c8c'],['Black','#2b2b2d']],sizes:['OS'],details:'Cotton twill, adjustable strap.'},
{id:'canvas-tote',name:'Canvas tote',shape:'tote',price:1600,colors:[['Sky','#a3b7cc'],['Black','#2b2b2d']],sizes:['OS'],details:'Reclaimed canvas with reinforced handles.'}];
const JOURNAL=[['Walking the city in the rain','Coming soon','#f0c4d2','hoodie'],['Why a quoin?','Coming soon','#a3b7cc','tee']];
/* ====== END EDIT ====== */
const SH={trouser:'<path d="M30 12h40l6 80H55L50 40l-5 52H24z"/>',jort:'<path d="M28 22h44l6 40H54l-4-18-4 18H22z"/>',hoodie:'<path d="M35 15l15 8 15-8 22 18-8 14-9-6v46H30V41l-9 6-8-14z"/>',tee:'<path d="M33 15l17 7 17-7 22 14-7 14-9-5v40H27V38l-9 5-7-14z"/>',cap:'<path d="M18 62C18 38 36 28 52 28s30 10 30 34z"/><path d="M60 60h32v7H60z"/>',tote:'<path d="M22 38h56l4 52H18z"/><path d="M36 38c0-22 28-22 28 0" fill="none" stroke="currentColor" stroke-width="4"/>'};
const sv=(s,c)=>`<svg viewBox="0 0 100 100" fill="${c}" style="color:${c}">${SH[s]}${s=='trouser'||s=='jort'?'<path d="M32 14h10l24 78H55z" fill="#fff" opacity=".18"/>':''}</svg>`;
const im=(p,c)=>p.img?`<img src="${p.img}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover">`:sv(p.shape,c);
const K=n=>'KES '+n.toLocaleString('en-KE');const $=i=>document.getElementById(i);
const LAUNCH=new Date(CFG.launch).getTime();let cart=[],fav={},sel={},slide=0;
$('em').textContent='Contact';$('em').onclick=()=>panel('<h2>CONTACT</h2><p>'+CFG.email+'</p><p><a href="https://wa.me/'+CFG.whatsapp+'" target="_blank" rel="noopener" style="border-bottom:1px solid">WhatsApp us</a></p>');$('ig').href=CFG.instagram;$('tt').href=CFG.tiktok;
document.querySelectorAll('[data-i]').forEach(a=>a.onclick=()=>panel('<h2>'+a.textContent.toUpperCase()+'</h2><p>'+a.dataset.i+'</p>'));
function mn(){$('menu').classList.toggle('on')}
function card(p){const c=p.colors[0][1];return`<a class="card" href="#p-${p.id}" style="text-decoration:none"><span class="nw">NEW</span><div class="pic">${im(p,c)}</div><span class="hr ${fav[p.id]?'on':''}" onclick="event.preventDefault();fav['${p.id}']=!fav['${p.id}'];route()">♥</span><div class="nm">${p.name}</div><div class="pr">${K(p.price)}</div><div class="sw"><div>${p.colors.map(x=>`<span style="background:${x[1]}"></span>`).join('')}</div><em>Q</em></div></a>`}
const HERO=[['#a3b7cc','#f7f4ef','trouser','#2b2b2d'],['#f0c4d2','#fff','hoodie','#325c8c'],['#2b2b2d','#17171a','tee','#f0c4d2']];
function home(){const h=HERO[slide];$('app').innerHTML=`<div class="cd" id="cdb"></div>
<div class="hero" style="background:${h[1]}"><div class="im" style="background:${h[0]}">${CFG.hero&&CFG.hero[slide]?'<img src="'+CFG.hero[slide]+'" alt="QUOIN" style="width:100%;height:100%;object-fit:cover">':sv(h[2],h[3])}</div><div class="tx" style="color:${h[1]=='#17171a'||h[1]=='#2b2b2d'?'#fff':'#1a1a1a'}"><b>QUOIN</b>${CFG.season}</div></div>
<div class="dots">${HERO.map((_,i)=>`<i class="${i==slide?'on':''}"></i>`).join('')}</div>
<section id="shop"><h2>NEW</h2><div class="grid">${PRODUCTS.map(card).join('')}</div><div class="more"><a href="#shop">VIEW MORE</a></div></section>
<div class="band" id="collection"><div class="h"><h2>COLLECTION</h2><a href="#shop" style="font-size:11px">VIEW MORE</a></div><div class="scr">${PRODUCTS.map(p=>`<div><a href="#p-${p.id}" style="text-decoration:none"><div class="p" style="background:${p.colors[0][1]}33">${im(p,p.colors[0][1])}</div>${p.name.toUpperCase()}</a></div>`).join('')}</div></div>
<section id="journal"><h2>HIGHLIGHTS</h2><div class="hl">${JOURNAL.map(j=>`<div><div class="p" style="background:${j[2]}">${sv(j[3],'#2b2b2d')}</div><p>${j[0]}<span>${j[1]}</span></p></div>`).join('')}</div></section>`;tick()}
function tick(){const b=$('cdb');if(!b)return;const d=LAUNCH-Date.now();
if(d<=0){if(document.body.classList.contains('g')){route();return}b.innerHTML='<small>WE’RE LIVE</small><div class="t"><b style="font-size:20px">Shop is open</b></div>';return}
const v=[Math.floor(d/864e5),Math.floor(d/36e5)%24,Math.floor(d/6e4)%60,Math.floor(d/1e3)%60],l=['DAYS','HRS','MIN','SEC'];
b.innerHTML=`<small>THE SHOP OPENS IN</small><div class="t">${v.map((x,i)=>`<div><b>${String(x).padStart(2,'0')}</b><span>${l[i]}</span></div>`).join('')}</div>`}
function prod(p){const s=sel[p.id]||(sel[p.id]={c:0,s:null}),c=p.colors[s.c],live=Date.now()>=LAUNCH||prev;
$('app').innerHTML=`<div class="pp"><div class="bc">QUOIN – ${p.name.toUpperCase()}</div><div class="pg"><div class="big">${im(p,c[1])}</div><div><span class="nw">NEW</span><h1>${p.name}</h1><div class="pc">${K(p.price)}</div><div style="color:var(--mut);font-size:11px;margin-top:4px">Ready to ship across Kenya</div>
<div class="lb">COLOR</div><div class="cs">${p.colors.map((x,i)=>`<button class="${i==s.c?'on':''}" onclick="sel['${p.id}'].c=${i};route()"><i style="background:${x[1]}"></i>${x[0]}</button>`).join('')}</div>
<div class="lb">SIZE</div><div class="sz">${p.sizes.map(z=>`<button class="${z==s.s?'on':''}" ${(p.out||[]).includes(z)?'disabled':''} onclick="sel['${p.id}'].s='${z}';route()">${z}</button>`).join('')}</div>
<details><summary>Details</summary><p>${p.details}</p></details><details><summary>Size</summary><p>Oversized fit. Model is 1.82 m and wears M.</p></details><details><summary>Customer Service</summary><p>Care: wash cold, hang dry. Nairobi delivery 1–2 days. Exchanges within 7 days.</p></details>
<button class="add" id="ab" ${live?'':'disabled'} onclick="add('${p.id}')">${live?'ADD TO CART':'OPENS AT LAUNCH'}</button><div id="m" style="font-size:11px;min-height:18px;margin-top:6px"></div>
<div class="box"><b>Returns and Exchanges Policy</b><br>We accept exchanges within 7 days on unworn items. Contact us for any enquiries.</div></div></div>
<h2 style="text-align:center;font-size:14px;margin:50px 0 20px;font-weight:400">You may also like</h2><div class="grid">${PRODUCTS.filter(x=>x!=p).slice(0,4).map(card).join('')}</div></div>`}
function add(id){const s=sel[id];if(!s||!s.s){$('m').textContent='Please choose a size.';return}cart.push({id,c:s.c,s:s.s});$('cn').textContent=cart.length;openCart()}
function openCart(){const t=cart.reduce((a,x)=>a+PRODUCTS.find(p=>p.id==x.id).price,0);$('cb').innerHTML=`<h2>BAG</h2>${cart.length?cart.map((x,i)=>{const p=PRODUCTS.find(q=>q.id==x.id);return`<div class="cl"><span>${p.name}<br><small>${p.colors[x.c][0]} · ${x.s}</small></span><span>${K(p.price)} <button onclick="cart.splice(${i},1);$('cn').textContent=cart.length;openCart()">✕</button></span></div>`}).join('')+`<div class="cl"><b>Subtotal</b><b>${K(t)}</b></div><button class="add" onclick="checkout()">CHECKOUT</button>`:'<p>Your bag is empty.</p>'}`;$('cart').classList.add('on')}
function cartX(){$('cart').classList.remove('on')}
let prev=0;const tot=()=>cart.reduce((a,x)=>a+PRODUCTS.find(p=>p.id==x.id).price,0);
function gated(){try{if(location.hash=='#preview')sessionStorage.qp=1;prev=prev||!!sessionStorage.qp}catch(e){}return CFG.maintenance&&Date.now()<LAUNCH&&!prev}
function panel(h){$('cb').innerHTML=h;$('cart').classList.add('on')}
function post(o){return fetch(CFG.formUrl,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(Object.assign(o,CFG.formKey?{access_key:CFG.formKey}:{}))})}
function gate(){$('app').innerHTML=`<div class="gate"><a class="wm" href="#">QUOIN<small>${CFG.tagline}</small></a><p>The shop is being built. Drop 01 opens soon.</p><div class="cd" id="cdb"></div><p>Get the drop, restocks and website updates first.</p><form onsubmit="event.preventDefault();sub(this)"><input name="em" type="email" required placeholder="Email address" aria-label="Email"><button>NOTIFY ME</button></form><div id="gm" style="font-size:11px;min-height:18px;color:var(--pink)"></div><div style="margin-top:20px;font-size:11px;letter-spacing:.14em"><a href="${CFG.instagram}" target="_blank" rel="noopener">INSTAGRAM</a> &nbsp;·&nbsp; <a href="${CFG.tiktok}" target="_blank" rel="noopener">TIKTOK</a></div></div>`;tick()}
async function sub(f){const em=f.em.value.trim(),m=$('gm');if(CFG.formUrl){try{const r=await post({email:em,type:'launch-list'});if(!r.ok)throw 0;m.textContent='You’re in. We’ll email you when it opens.';f.reset()}catch(x){m.textContent='Something went wrong. Please try again.'}return}location.href='mailto:'+CFG.email+'?subject='+encodeURIComponent('Notify me: QUOIN drops')+'&body='+encodeURIComponent('Please add me to the list: '+em);m.textContent='Send the email that just opened to join the list.'}
function checkout(){const t=tot(),sh=t>=CFG.freeOver?0:CFG.ship;panel(`<h2>CHECKOUT</h2><form class="ck" onsubmit="event.preventDefault();place(this)"><label>Full name</label><input name="n" required autocomplete="name"><label>Email</label><input name="e" type="email" required autocomplete="email"><label>Phone (M-Pesa)</label><input name="p" type="tel" required placeholder="07XX XXX XXX" autocomplete="tel"><label>Delivery address</label><input name="a" required><label>County</label><select name="c"><option>Nairobi</option><option>Kiambu</option><option>Mombasa</option><option>Nakuru</option><option>Kisumu</option><option>Other</option></select><label>Town</label><input name="w" required><label>Payment</label><div class="pm"><label><input type="radio" name="m" value="mpesa" checked> M-Pesa</label>${CFG.payLink?'<label><input type="radio" name="m" value="card"> Card</label>':''}</div><div class="cl"><span>Subtotal</span><span>${K(t)}</span></div><div class="cl"><span>Delivery</span><span>${sh?K(sh):'Free'}</span></div><div class="cl"><b>Total</b><b>${K(t+sh)}</b></div><button class="add">PLACE ORDER</button></form>`)}
function place(f){const d=Object.fromEntries(new FormData(f)),t=tot(),T=t+(t>=CFG.freeOver?0:CFG.ship),id='QN-'+Math.floor(1000+Math.random()*9000);
const ls=cart.map(x=>{const p=PRODUCTS.find(q=>q.id==x.id);return p.name+' ('+p.colors[x.c][0]+', '+x.s+') '+K(p.price)}).join('\n');
const msg='QUOIN order '+id+'\n'+ls+'\nTotal: '+K(T)+'\nName: '+d.n+'\nPhone: '+d.p+'\nAddress: '+d.a+', '+d.w+', '+d.c+'\nPayment: '+d.m;
if(CFG.formUrl)post({type:'order',order:id,email:d.e,message:msg}).catch(()=>{});
const pay=d.m=='card'&&CFG.payLink?`<a class="add" style="text-align:center;text-decoration:none" href="${CFG.payLink}" target="_blank" rel="noopener">PAY ${K(T)} BY CARD</a>`:`<div class="box" style="color:var(--fg)"><b>Pay with M-Pesa</b><br>Lipa na M-Pesa, Buy Goods, Till <b>${CFG.till}</b><br>Amount <b>${K(T)}</b> · Reference <b>${id}</b></div>`;
cart=[];$('cn').textContent=0;panel(`<h2>ORDER ${id}</h2><p>Thank you, ${d.n.replace(/</g,'')}. We reserve your order once payment is confirmed.</p>${pay}<a class="add" style="text-align:center;text-decoration:none" href="https://wa.me/${CFG.whatsapp}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">SEND ORDER ON WHATSAPP</a><p style="font-size:11px;color:var(--mut)">Send your M-Pesa confirmation message on WhatsApp so we can ship. Nairobi 1–2 days, rest of Kenya 3–5.</p>`)}
function admin(){$('app').innerHTML=`<div class="pp ck"><h2>PHOTO HELPER</h2><p>1. Pick a photo. 2. Copy the text. 3. Paste it between the quotes after <b>img:</b> on a product (or inside <b>hero:[ ]</b>).</p><input type="file" accept="image/*" onchange="shrink(this.files[0])"><img id="ap" alt="" style="max-width:100%;margin:14px 0"><textarea id="at" rows="5" style="width:100%;font-size:11px"></textarea><button class="add" onclick="$('at').select();document.execCommand('copy')">COPY</button></div>`}
function shrink(f){if(!f)return;const i=new Image();i.onload=()=>{const s=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.8);$('ap').src=u;$('at').value=u};i.src=URL.createObjectURL(f)}
function route(){const h=location.hash.slice(1);const g=gated()&&h!='admin';document.body.classList.toggle('g',g);if(h=='admin'){admin();return}if(g){gate();return}if(h.startsWith('p-')){const p=PRODUCTS.find(x=>'p-'+x.id==h);if(p){prod(p);return}$('app').innerHTML='<div class="nf"><h2>This corner doesn’t exist.</h2><a href="#" style="border-bottom:1px solid">BACK HOME</a></div>';return}
home();if(h){const e=$(h);e&&e.scrollIntoView()}}
addEventListener('hashchange',()=>{route();if(location.hash.startsWith('#p-'))scrollTo(0,0)});
setInterval(tick,1000);setInterval(()=>{if(!location.hash.startsWith('#p-')&&!location.hash&&!document.body.classList.contains('g')){slide=(slide+1)%HERO.length;route()}},5000);route();
</script></body></html>
